<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription réussie — Desert Warriors</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 45px 28px;
      border-radius: 18px;
      background: #111;
      border: 1px solid #292929;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      width: 150px;
      max-width: 60%;
      margin-bottom: 30px;
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #d71920;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .line {
      width: 70px;
      height: 3px;
      margin: 0 auto 25px;
      background: #d71920;
    }

    p {
      margin: 10px 0;
      color: #d5d5d5;
      font-size: 17px;
      line-height: 1.6;
    }

    .important {
      margin-top: 25px;
      color: #fff;
      font-weight: 600;
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 25px;
      border-radius: 8px;
      background: #d71920;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: .5px;
    }

    .btn:hover {
      background: #b9141b;
    }

    .footer {
      margin-top: 30px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="logo-desert-warriors.png"
      alt="Desert Warriors"
      class="logo"
    >

    <div class="check">✓</div>

    <h1>Inscription réussie</h1>

    <div class="line"></div>

    <p>
      Votre demande d’inscription a bien été reçue.
    </p>

    <p class="important">
      Notre équipe vous contactera prochainement.
    </p>

    <a
      href="index.html"
      class="btn"
    >
      RETOURNER AU SITE
    </a>

    <div class="footer">
      Desert Warriors Ultimate Fighting<br>
      Saison sportive 2026 / 2027
    </div>

  </div>

</body>
</html>
